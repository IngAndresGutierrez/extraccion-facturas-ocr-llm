<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extracción de facturas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css?v=4">
  <script>
    // Aplica el tema guardado antes de pintar para evitar un destello del tema contrario.
    try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header>
    <div>
      <h1>Extracción de campos de facturas PDF</h1>
      <p>Texto seleccionable, OCR y LLM local · ejecución en CPU</p>
    </div>
    <button type="button" id="theme" class="theme" aria-label="Cambiar tema"></button>
  </header>

  <main>
    <form id="form" class="card" novalidate>
      <label class="drop" id="drop">
        <input type="file" id="file" name="file" accept="application/pdf,.pdf">
        <span id="drop-text">Arrastra un PDF aquí o <u>elige un archivo</u></span>
        <small id="analysis" class="analysis" hidden></small>
      </label>

      <fieldset>
        <legend>Método</legend>
        <label class="method">
          <input type="radio" name="method" value="texto_regex" checked>
          <span><strong>Texto directo + regex</strong><small>PDF con texto seleccionable · &lt; 1 s</small></span>
          <em class="badge" hidden>Sugerido</em>
        </label>
        <label class="method">
          <input type="radio" name="method" value="ocr_regex">
          <span><strong>OCR + regex</strong><small>PDF escaneado · Tesseract · ≈ 1 s</small></span>
          <em class="badge" hidden>Sugerido</em>
        </label>
        <label class="method">
          <input type="radio" name="method" value="ocr_llm">
          <span><strong>OCR + LLM</strong><small>PDF escaneado · Qwen2.5 3B local · ≈ 1 min</small></span>
          <em class="badge" hidden>Sugerido</em>
        </label>
      </fieldset>

      <div class="actions">
        <button type="submit" id="submit">Extraer campos</button>
        <button type="button" id="restart" class="secondary" hidden>Nueva extracción</button>
      </div>
    </form>

    <section id="status" class="card status" hidden aria-live="polite">
      <div class="spinner"></div>
      <div class="status-body">
        <strong id="status-title"></strong>
        <p id="status-detail"></p>
        <div class="bar" id="bar" hidden><div id="bar-fill"></div></div>
      </div>
      <button type="button" id="cancel" class="secondary" hidden>Cancelar</button>
    </section>

    <section id="result" class="card" hidden>
      <div class="result-head">
        <div>
          <h2 id="result-title"></h2>
          <p id="result-meta"></p>
        </div>
        <div class="actions">
          <button type="button" id="copy" class="secondary">Copiar JSON</button>
          <a id="download" class="button" href="#" download>Descargar JSON</a>
        </div>
      </div>
      <ul id="warnings" class="warnings"></ul>

      <div class="compare">
        <div class="preview">
          <h3>Documento</h3>
          <iframe id="preview" title="Vista previa del PDF"></iframe>
        </div>
        <div>
          <h3>Campos</h3>
          <table id="fields"><tbody></tbody></table>
        </div>
      </div>

      <h3>Líneas de producto</h3>
      <div class="scroll"><table id="lines"><thead></thead><tbody></tbody></table></div>

      <details>
        <summary>Texto leído</summary>
        <pre id="text"></pre>
      </details>
      <details>
        <summary>JSON completo</summary>
        <pre id="json"></pre>
      </details>
    </section>
  </main>

  <script src="/static/app.js?v=4"></script>
</body>
</html>
